<!DOCTYPE html>
<html lang="it" data-tema="originale">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- colore della barra del browser sul telefono: cambia con lo stile scelto (js/temi.js) -->
<meta name="theme-color" content="#0F0E14">
<title>RVG Coaching</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- per iPhone/iPad quando l'app è aggiunta alla schermata Home -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RVG Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="La tua scheda di allenamento: registra le serie, guarda i progressi e manda il check-in al coach.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/temi.css">
</head>
<body>
<main id="app"></main>
<nav class="schede" aria-label="Sezioni"><div class="dentro" id="schede"></div></nav>
<!-- finestra per conferme e modifiche -->
<div id="modale"></div>
<!-- avvisi temporanei (es. "Scheda importata"); role="status" li fa leggere ai lettori di schermo -->
<div id="avviso" role="status" aria-live="polite"></div>
<input type="file" id="scegliFile" accept="application/json,.json" hidden>
<!-- type="module": il file può importare funzioni dagli altri file in js/ -->
<script type="module" src="js/app.js"></script>
</body>
</html>
